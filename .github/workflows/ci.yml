name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm install
      - run: npm run build --if-present
      - name: Lint
        run: npm run lint --if-present
      - run: npm test --if-present
